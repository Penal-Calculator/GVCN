<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GVCN Penal Code Calculator</title>
<link rel="icon" type="image/png" href="gvcn-logo.png">
<style>
  :root {
    --bg: #121212;
    --surface: #1e1e1e;
    --surface-alt: #2a2a2a;
    --border: #333333;
    --text: #e0e0e0;
    --text-muted: #888888;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --felony: #dc2626;
    --misdemeanor: #d97706;
    --citation: #0284c7;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 20px;
    background-color: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }

  .container {
    max-width: 1200px;
    margin: 0 auto;
  }

  header {
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 15px;
  }

  h1 {
    font-size: 20px;
    margin: 0 0 5px 0;
    font-weight: 600;
  }

  .subtitle {
    color: var(--text-muted);
    font-size: 13px;
    margin: 0;
  }

  .layout {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 20px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 15px;
  }

  /* Search & Filters */
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
  }

  input[type="search"] {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
    padding: 8px 12px;
    font-size: 14px;
    outline: none;
  }

  input[type="search"]:focus {
    border-color: var(--accent);
  }

  .filters {
    display: flex;
    gap: 6px;
    margin-bottom: 15px;
    flex-wrap: wrap;
  }

  .filter-btn {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 4px 10px;
    border-radius: 4px;
    font-size: 12px;
    cursor: pointer;
  }

  .filter-btn.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  /* Code List */
  .section-header {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    margin: 15px 0 8px 0;
    font-weight: 700;
  }

  .code-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
  }

  .code-item:hover {
    background: var(--surface-alt);
  }

  .code-item input {
    cursor: pointer;
  }

  .code-num {
    font-family: monospace;
    font-weight: bold;
    color: #93c5fd;
    min-width: 45px;
  }

  .code-info {
    flex: 1;
  }

  .code-name {
    font-weight: 500;
  }

  .code-meta {
    font-size: 12px;
    color: var(--text-muted);
  }

  .tag {
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 3px;
    text-transform: uppercase;
    font-weight: bold;
  }
  .tag.felony { background: rgba(220, 38, 38, 0.2); color: #f87171; }
  .tag.misdemeanor { background: rgba(217, 119, 6, 0.2); color: #fbbf24; }
  .tag.citation { background: rgba(2, 132, 199, 0.2); color: #38bdf8; }

  .code-punishment {
    text-align: right;
    font-size: 12px;
    color: var(--text-muted);
    min-width: 120px;
  }

  /* Summary Sidebar */
  .summary h2 {
    font-size: 15px;
    margin: 0 0 10px 0;
    border-bottom: 1px solid var(--border);
    padding-bottom: 8px;
  }

  .stats-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
  }

  .stat-box {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 8px;
    border-radius: 4px;
  }

  .stat-box label {
    font-size: 10px;
    text-transform: uppercase;
    color: var(--text-muted);
    display: block;
  }

  .stat-box span {
    font-size: 16px;
    font-weight: bold;
  }

  .preview-box {
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 10px;
    border-radius: 4px;
    font-family: monospace;
    font-size: 12px;
    white-space: pre-wrap;
    margin-bottom: 12px;
    color: #a5b4fc;
    min-height: 80px;
  }

  button.action-btn {
    width: 100%;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 4px;
    padding: 10px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 6px;
  }

  button.action-btn:hover { background: var(--accent-hover); }
  button.action-btn:disabled { background: var(--border); color: var(--text-muted); cursor: not-allowed; }

  button.secondary-btn {
    width: 100%;
    background: transparent;
    color: var(--text-muted);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    cursor: pointer;
  }
  button.secondary-btn:hover { background: var(--surface-alt); color: var(--text); }

  @media(max-width: 800px) {
    .layout { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>GVCN Penal Code Calculator</h1>
    <p class="subtitle">GVCN Public Services use only. Unauthorized use in other servers will result in a moderation.</p>
  </header>

  <div class="layout">
    <!-- Main Database Panel -->
    <div class="panel">
      <div class="toolbar">
        <input type="search" id="search" placeholder="Search code, title, or keyword..." autocomplete="off">
      </div>
      <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="Felony">Felony</button>
        <button class="filter-btn" data-filter="Misdemeanor">Misdemeanor</button>
        <button class="filter-btn" data-filter="Citation">Citation</button>
        <button class="filter-btn" data-filter="impound">Impoundment</button>
      </div>
      <div id="results"></div>
      <div id="empty" style="display:none; text-align:center; padding: 20px; color: var(--text-muted);">No matching codes found.</div>
    </div>

    <!-- Summary / Sidebar Panel -->
    <div class="panel summary">
      <h2>Summary</h2>
      <div class="stats-row">
        <div class="stat-box"><label>Charges</label><span id="totalCharges">0</span></div>
        <div class="stat-box"><label>Fine</label><span id="totalFine">$0</span></div>
        <div class="stat-box"><label>Jail Time</label><span id="totalJail">0s</span></div>
        <div class="stat-box"><label>Impound</label><span id="totalImpound">No</span></div>
      </div>
      
      <div style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 4px; font-weight: bold;">Discord Output</div>
      <div class="preview-box" id="preview">Select a charge to generate output.</div>
      
      <button id="copyBtn" class="action-btn" disabled>Copy Output</button>
      <button id="clearSelected" class="secondary-btn">Reset Selection</button>
    </div>
  </div>
</div>

const state = { selected: new Set(), query: "", filter: "all" };

const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const searchEl = document.getElementById("search");
const previewEl = document.getElementById("preview");

const money = n => "$" + Number(n).toLocaleString("en-US");

function punishmentText(c){
  if(c.inactive) return c.punishment;
  const parts = [];
  if(c.jail) parts.push(`${c.jail}s`);
  if(c.fine) parts.push(`${money(c.fine)}`);
  if(c.impound) parts.push(`Impound`);
  return parts.length ? parts.join(" / ") : (c.punishment || "None");
}

function matches(c){
  const q = state.query.trim().toLowerCase();
  const text = [c.code, c.name, c.classification, c.title].join(" ").toLowerCase();
  const queryOK = !q || text.includes(q);
  let filterOK = true;
  if(state.filter === "impound") filterOK = !!c.impound;
  else if(state.filter !== "all") filterOK = c.classification === state.filter;
  return queryOK && filterOK;
}

function render(){
  const visible = CODES.filter(matches);
  resultsEl.innerHTML = "";
  let lastSection = null;

  visible.forEach(c => {
    if(lastSection !== c.section){
      const heading = document.createElement("div");
      heading.className = "section-header";
      heading.textContent = `Title ${c.section}: ${c.title}`;
      resultsEl.appendChild(heading);
      lastSection = c.section;
    }

    const row = document.createElement("label");
    row.className = "code-item";
    const checked = state.selected.has(c.code) ? "checked" : "";
    const tagClass = (c.classification || "").toLowerCase();
    
    row.innerHTML = `
      <input type="checkbox" data-code="${c.code}" ${checked} ${c.inactive ? "disabled" : ""}>
      <span class="code-num">${c.code}</span>
      <div class="code-info">
        <div class="code-name">${escapeHTML(c.name)}</div>
        <div class="code-meta"><span class="tag ${tagClass}">${escapeHTML(c.classification)}</span></div>
      </div>
      <div class="code-punishment">${escapeHTML(punishmentText(c))}</div>
    `;
    resultsEl.appendChild(row);
  });

  emptyEl.style.display = visible.length ? "none" : "block";

  document.querySelectorAll("input[type='checkbox']").forEach(box => {
    box.addEventListener("change", (e) => {
      if(e.target.checked) state.selected.add(e.target.dataset.code);
      else state.selected.delete(e.target.dataset.code);
      updateSummary();
    });
  });
}

function updateSummary(){
  const selected = CODES.filter(c => state.selected.has(c.code));
  const fine = selected.reduce((s,c) => s + (c.fine || 0), 0);
  const jail = selected.reduce((s,c) => s + (c.jail || 0), 0);
  const impound = selected.some(c => c.impound);

  document.getElementById("totalCharges").textContent = selected.length;
  document.getElementById("totalFine").textContent = money(fine);
  document.getElementById("totalJail").textContent = `${jail}s`;
  document.getElementById("totalImpound").textContent = impound ? "Yes" : "No";

  const copyBtn = document.getElementById("copyBtn");
  copyBtn.disabled = !selected.length;

  if(selected.length) {
    previewEl.textContent = `**Charge(s):** ${selected.map(c => `${c.code} -${c.name}`).join(", ")}\n*Total Fine:* ${money(fine)}\n*Jail Time:* ${jail}s\n*Impoundment:* ${impound ? "Yes" : "No"}`;
  } else {
    previewEl.textContent = "Select a charge to generate output.";
  }
}

function escapeHTML(str){
  return String(str).replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;" }[ch]));
}

searchEl.addEventListener("input", e => { state.query = e.target.value; render(); });

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    state.filter = btn.dataset.filter;
    render();
  });
});

document.getElementById("clearSelected").addEventListener("click", () => {
  state.selected.clear();
  updateSummary();
  render();
});

document.getElementById("copyBtn").addEventListener("click", async () => {
  try {
    await navigator.clipboard.writeText(previewEl.textContent);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy Output", 1500);
  } catch(e) {
    console.error(e);
  }
});

render();
updateSummary();
</script>
